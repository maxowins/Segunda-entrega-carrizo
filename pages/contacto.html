<!-- pages/contacto.html -->
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../img/logo.png">

  <title>Contacto - De todo Bazar</title>
</head>

<body>

  <!-- Header -->
  <header class="ml-header">
    <div class="container py-3">
      <div class="row align-items-center g-2">

        <!-- Logo -->
        <div class="col-12 col-md-2 text-center text-md-start">
          <a href="../index.html" class="d-inline-flex align-items-center text-decoration-none">
            <img src="../img/logo.png" alt="Logo de De todo Bazar" class="ml-logo">
            <span class="ms-2 fw-semibold text-dark">De todo Bazar</span>
          </a>
        </div>

        <!-- Buscador -->
        <div class="col-12 col-md-7">
          <div class="input-group">
            <input type="text" class="form-control" placeholder="Buscá tu consulta" aria-label="Buscar">
            <button class="btn btn-light" type="button" aria-label="Buscar">Buscar</button>
          </div>
        </div>

        <!-- Accesos -->
        <div class="col-12 col-md-3">
          <div class="d-flex justify-content-center justify-content-md-end gap-3">
            <a href="#" class="ml-link" aria-label="Mi cuenta">👤 Mi cuenta</a>
            <a href="#" class="ml-link" aria-label="Carrito">🛒 Carrito</a>
            <a href="#" class="ml-link d-none d-md-inline" aria-label="Notificaciones">🔔 Notificaciones</a>
          </div>
        </div>

      </div>
    </div>

    <!-- Navegación -->
    <nav class="ml-nav">
      <div class="container">
        <ul class="nav py-2">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main class="container my-4">

    <section class="mb-3">
      <h1 class="h3 mb-1">Contacto</h1>
      <p class="text-muted mb-0">Escribinos y te respondemos lo antes posible.</p>
    </section>

    <div class="d-flex flex-column gap-3">

      <!-- Ayuda rápida -->
      <section>
        <div class="card">
          <div class="card-body">
            <h2 class="h6 mb-3">Ayuda rápida</h2>

            <div class="d-grid gap-2">
              <a class="btn btn-outline-primary btn-sm text-start" href="#" aria-label="Ir a devoluciones y cambios">
                🔄 Devoluciones y cambios
              </a>
              <a class="btn btn-outline-primary btn-sm text-start" href="#" aria-label="Ir a reclamos">
                📦 Reclamos
              </a>
              <a class="btn btn-outline-primary btn-sm text-start" href="#" aria-label="Ir a envíos">
                📬 Envíos
              </a>
              <a class="btn btn-outline-primary btn-sm text-start" href="#" aria-label="Ir a promociones">
                🏷️ Promociones
              </a>
            </div>
          </div>
        </div>
      </section>

      <!-- Formulario -->
      <section>
        <div class="card mx-auto" style="max-width: 720px;">
          <div class="card-body">
            <h2 class="h6 mb-3">Formulario</h2>

            <form>
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" type="text" class="form-control" placeholder="Tu nombre" required>
              </div>

              <div class="mb-3">
                <label for="apellido" class="form-label">Apellido</label>
                <input id="apellido" type="text" class="form-control" placeholder="Tu apellido" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" placeholder="nombre@ejemplo.com" required>
              </div>

              <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono (opcional)</label>
                <input id="telefono" type="text" class="form-control" placeholder="11 1234 5678">
              </div>

              <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea id="mensaje" class="form-control" rows="4" placeholder="Contanos tu consulta..." required></textarea>
              </div>

              <button type="submit" class="btn btn-primary" aria-label="Enviar formulario de contacto">Enviar</button>
            </form>

          </div>
        </div>
      </section>

    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center py-4">
    <p class="mb-2">Todos los derechos reservados</p>

    <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
      <img src="../img/instagram.png" alt="Logo de Instagram" class="ml-social">
    </a>

    <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
      <img src="../img/facebook.png" alt="Logo de Facebook" class="ml-social">
    </a>

    <a href="https://x.com/?lang=es" target="_blank" rel="noopener noreferrer" aria-label="X">
      <img src="../img/X.png" alt="Logo de X" class="ml-social">
    </a>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
