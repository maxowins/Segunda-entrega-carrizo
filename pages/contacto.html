<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/img/logo.png">
    <title>Contacto - De todo Bazar</title>
</head>

<body>

    <!-- header -->
    <header>
        <div class="encabezado">
            <img src="/img/logo.png" alt="logo" class="logo">
            <h2 class="titulo-web">De todo Bazar</h2>

            <div class="iconos">
                <span>👤</span>
                <label>Mi cuenta</label>
                <span>🛒</span>
                <label>Carrito</label>
                <span>🔔</span>
                <label>Notificaciones</label>
            </div>
        </div>

        <nav>
            <ul>
                <li><a href="/index.html">Inicio</a></li>
                <li><a href="/pages/productos.html">Productos</a></li>
                <li><a href="/pages/contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <form class="buscador">
            <input type="text" placeholder="Busca tu consulta">
        </form>
    </header>


    <!-- contenido principal -->
    <main>

        <!-- caja de preguntas -->
        <section class="preguntas">
            <p>🔄 <a href="#">Devolver una compra</a></p>
            <p>📦 <a href="#">Iniciar o seguir un reclamo</a></p>
            <p>📬 <a href="#">Cuándo llegan mis compras</a></p>
            <p><a href="#">Ayuda con cupones</a></p>
        </section>

        <!-- titulo -->
        <section>
            <h1>Contacto</h1>
            <p>Completá el formulario para que podamos ayudarte.</p>
            <p>Responderemos tu consulta a la brevedad.</p>
        </section>

        <!-- formulario -->
        <section class="formulario">
            <form>

                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" placeholder="Nombre">

                <label for="apellido">Apellido</label>
                <input id="apellido" type="text" placeholder="Apellido">

                <label for="email">Email</label>
                <input id="email" type="email" placeholder="Email">

                <label for="telefono">Teléfono</label>
                <input id="telefono" type="text" placeholder="Teléfono (opcional)">

                <button type="submit">Enviar</button>

            </form>
        </section>

    </main>

    <!-- footer -->
    <footer>
        <p>Todos los derechos reservados</p>
        <a href="https://www.instagram.com" target="_blank">
            <img src="/img/instagram.png" alt="instagram">
        </a>
        <a href="https://www.facebook.com" target="_blank">
            <img src="/img/facebook.png" alt="facebook.png">
        </a>
        <a href="https://x.com/?lang=es" target="_blank">
            <img src="/img/X.png" alt="X.png">
        </a>
    </footer>

</body>
</html>
